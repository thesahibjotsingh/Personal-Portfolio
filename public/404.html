<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0909" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=IBM+Plex+Mono:wght@400&family=Dancing+Script:wght@700&display=swap"
    />
    <title>Page not found — Sahibjot Singh</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #0a0909;
        color: #f4f1ea;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100svh;
      }
      header { padding: 1.5rem clamp(1.5rem, 4vw, 3rem); }
      .wordmark {
        font-family: "Dancing Script", cursive;
        font-weight: 700;
        font-size: 2.25rem;
        color: #ee4658;
        text-decoration: none;
        line-height: 1;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem clamp(1.5rem, 4vw, 3rem) 4rem;
      }
      .code {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7a7a7a;
      }
      h1 {
        margin: 1rem 0 0;
        font-weight: 800;
        font-size: clamp(2.75rem, 11vw, 9rem);
        line-height: 0.92;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      h1 span { color: #ee4658; }
      p {
        margin: 1.75rem 0 0;
        max-width: 38ch;
        font-size: 1.0625rem;
        line-height: 1.6;
        color: #9b9b9b;
      }
      .actions { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a.btn {
        display: inline-block;
        padding: 0.95rem 1.6rem;
        border: 1px solid #ee4658;
        border-radius: 3px;
        color: #ee4658;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9375rem;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      a.btn:hover, a.btn:focus-visible { background: #ee4658; color: #0a0909; }
      a.btn.quiet { border-color: rgba(255, 255, 255, 0.18); color: #f4f1ea; }
      a.btn.quiet:hover, a.btn.quiet:focus-visible { background: #f4f1ea; color: #0a0909; border-color: #f4f1ea; }
      a:focus-visible { outline: 2px solid #ee4658; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <header>
      <a class="wordmark" href="/" aria-label="Saheb — home">Saheb</a>
    </header>
    <main>
      <div class="code">Error 404</div>
      <h1>This page<br /><span>doesn't exist.</span></h1>
      <p>The link may be old or mistyped. The work, and the quickest way to reach me, are on the home page.</p>
      <div class="actions">
        <a class="btn" href="/">Back to home</a>
        <a class="btn quiet" href="/#contact">Start your brief</a>
      </div>
    </main>
  </body>
</html>
